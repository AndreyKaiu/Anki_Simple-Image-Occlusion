<div id="qa" dir="auto" style="opacity: 1;"><style>:root {
    --rectyellow: rgba(255, 235, 162, 1); /* color of the main rectangles */
    --rectyellowtransparent: rgba(255, 235, 162, 0); /* as above, but 0 at the end */
    --rectblue: rgba(1, 78, 140, 1); /* color of additional rectangles */
    --goodanswer: rgb(10, 240, 10); /* the color of the rectangle for the correct answer */
    --diactricnotequal: #0913c1; /* font color if diacritical marks are not equal */
    --badanswer: #fb8c8c; /* the color of the rectangle if the answer is incorrect */
    --line-color: #aa007f; /* The color of the line and border rect */
    --move-line-color: #ff0000; /* Line color when hovering over an arrow */

.pointer-enabled * {
    cursor: none !important;
}
body {
    overflow-x: visible !important;
    overflow-y: visible !important;
}
    
.card {
    font-family: arial;
    font-size: 20px;
    line-height: 1.5;
    text-align: center;
    color: black;
    background-color: white;
}

.sio-container {
    overflow-x: scroll !important;
    overflow-y: hidden !important;      
    margin 0px;
    padding 10px;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto !important;
    position: relative;
    z-index: 3;
}
.sio-container.moveEnabled:active {       
   cursor: move;
}

.sio-image-container {
    position: relative;
    width: fit-content;
    height: fit-content;
    max-height: none !important;
    max-width: none !important;       
    display: inline-block;    
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none; 
    z-index: 3;
    line-height: 0;        
    border-width: 1px;
    border-color: gray;
    border-style: solid;
    margin: 0;
    padding: 0;    
}


.sio-image-container .sio-image {    
    max-height: none !important;
    max-width: none !important;
    border-width: 0;    
    margin: 0;    
    width: 100vw;
    object-fit: cover;
    -webkit-user-drag: none !important;   
    pointer-events: auto !important;
    line-height: 0;
    cursor: default;
}


.sio-rect {
  position: absolute;
  background-color: var(--rectyellow);
  border: 2px solid var(--line-color); /* The color of the line and border rect */
  cursor: default;
  box-sizing: border-box;
  margin: 0px;
  padding: 0px;
  transform-origin: 0 0; /* The point of rotation */
  z-index: 10;    
  color: black;
  display: flex;
  justify-content: center;      
  align-items: center;          
  text-align: center;           
  white-space: normal;          
  word-break: break-word;         
  font-size: 8px;
  letter-spacing: 0.07em;
  line-height: 1;        
  user-select: none;          
  -webkit-touch-callout: none;
  -webkit-user-select: none; 
  opacity: 1.0;
}  


.sio-rect.selected:not(.line):not(.hiding) {
  z-index: 110;
}

.sio-rect:not(.selected):not(.attention):not(.line)[hard="-1"] {
    z-index: 9;
    color: #565656 !important;
    border-color: rgb(32 119 0);
}
 .sio-rect:not(.selected):not(.attention):not(.line)[hard="1"], .sio-rect:not(.selected):not(.attention):not(.line)[hard="+1"] {
    z-index: 11;
    color: rgb(0 13 255) !important;
    border-color: rgb(0 13 255) !important;
}


.sio-rect.attention {
    border: 2px solid #ca0101;
    color: #ca0101 !important;
}

.sio-rect.round {
    border-radius: 50%;
}
.sio-rect.hiding {
  background-color: var(--rectblue);
  border: 1.5px solid blue;
    user-select: none;          
    -webkit-touch-callout: none;
  -webkit-user-select: none;
  z-index: 5;
}
.sio-rect.transparent {
  background-color: var(--rectyellowtransparent);
}


.w25 .sio-rect {

.w50 .sio-rect {

  position: absolute;
  background-color: var(--line-color); /* The color of the line and border rect */

  z-index: 200;

.sio-rect.line {

.w75 .sio-rect.line  {

.w100 .sio-rect.line, .w125 .sio-rect.line, .w150 .sio-rect.line {

.w200 .sio-rect.line, .w300 .sio-rect.line, .w400 .sio-rect.line  {

@media (max-width: 400px) {

.sio-rect.line::before {
    content: "";
    position: absolute;
    right: 0; 
    top: 50%;
    transform: translate(50%, -50%);
    width: 4px;
    height: 4px;
    background-color: var(--line-color);
    border-radius: 50%;
}

.w25 .sio-rect.line::before, .w50 .sio-rect.line::before {    
    width: 2px;
    height: 2px;
}
.w75 .sio-rect.line::before {    
    width: 3px;
    height: 3px;
}
.w125 .sio-rect.line::before {    
    width: 5px;
    height: 5px;
} 
.w150 .sio-rect.line::before {    
    width: 5px;
    height: 5px;
} 
.w200 .sio-rect.line::before {    
    width: 7px;
    height: 7px;
} 
.w300 .sio-rect.line::before {    
    width: 8px;
    height: 8px;
} 
.w400 .sio-rect.line::before {    
    width: 9px;
    height: 9px;
}


@media (max-width: 400px) {    
    .w25 .sio-rect.line::before, .w50 .sio-rect.line::before, .w75 .sio-rect.line::before, .w100 .sio-rect.line::before, .wfit .sio-rect.line::before, .w125 .sio-rect.line::before {    
        width: 2px;
        height: 2px;
    }
    .w150 .sio-rect.line::before, .w200 .sio-rect.line::before, .h100 .sio-rect.line::before {    
        width: 3px;

    }    
    .w300 .sio-rect.line::before, .w400 .sio-rect.line::before {    
        width: 4px;
        height: 4px;
    }
}



.sio-rect.line::after {
    content: "";
    position: absolute;
    left: 0; /* beginning of the line */
    /* right: 0;  end of the line */
    top: 50%;
    transform: translate(-50%, -50%); /* 50%, -50% end of the line */
    width: 0;
    height: 0;        
}

.sio-rect.line::after {    
    border-right: 6px solid red; /* The color of the line and border rect */    
    border-top: 3px solid transparent;
    border-bottom: 3px solid transparent;        
}
    
.w25 .sio-rect.line::after {    
    border-right: 4px solid red; /* The color of the line and border rect */    
    border-top: 2px solid transparent;
    border-bottom: 2px solid transparent;
}

.w125 .sio-rect.line::after, .w150 .sio-rect.line::after, .w200 .sio-rect.line::after {    
    border-right: 8px solid red; /* The color of the line */ 
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
} 
.w300 .sio-rect.line::after, .w400 .sio-rect.line::after {    
    border-right: 10px solid red; /* The color of the line */ 
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
} 


@media (max-width: 400px) {
    .w25 .sio-rect.line::after, .w50 .sio-rect.line::after, .w75 .sio-rect.line::after, .w100 .sio-rect.line::after, .wfit .sio-rect.line::after, .w125 .sio-rect.line::after {    
        border-right: 4px solid red; /* The color of the line and border rect */

    }
    .w150 .sio-rect.line::after, .w200 .sio-rect.line::after, .h100 .sio-rect.line::after {

        border-right: 8px solid red; /* The color of the line and border rect */    
        border-top: 4px solid transparent;

}

.sio-rect.line:empty:before, .sio-rect.hiding:empty:before,

.sio-rect::after {

function parseLangSS(input) {        
    let langSS = (input || '').trim();
    if(langSS == '') {
        return {
            disabled: true,
            lang: '',
            voices: '',
            speed: ''
        };
    }
    
    let result = {
        disabled: false,
        lang: '',
        voices: '',
        speed: ''
    };
    
    if (langSS.startsWith('-')) {
        result.disabled = true;
        langSS = langSS.slice(1).trim();
    }
    
    if (langSS.startsWith('tts')) {
        langSS = langSS.slice(3).trim();
    }
    
    function extractParam(name) {
        const regex = new RegExp(`${name}=([^\\s]+)`);
        const match = langSS.match(regex);
        if (match) {
            langSS = langSS.replace(match[0], '').trim();
            return match[1];
        }
        return '';
    }
    
    result.voices = extractParam('voices');
    result.speed  = extractParam('speed');
    let langParam = extractParam('lang');
    if (langParam) {
        result.lang = langParam;
    } else {            
        result.lang = langSS.trim();
    }
    
    if (result.disabled && result.lang) {
        result.lang = '-' + result.lang;
    }
    
    return result;
}

function fx(s, p) {
    var r = "";    
    if(p.length == 0) p = "xSsdfgd6";    
    if(s.length > p.length) p = p.repeat( Math.ceil(s.length/p.length) );
    for (var i = 0; i < s.length; ++i) {
        r += String.fromCharCode(s.charCodeAt(i) ^ p.charCodeAt(i) ^ (1 + (p.length - i) % 32));
    }
    return r;
}
function fec(s, p) {
    return btoa(fx(s, p));
}
function fdc(s, p) {
    return fx(atob(s), p);
}


function kitcut( text, limit) {
text = text.trim();
if( text.length <= limit) {
return text;
}        
text = text.slice( 0, limit);
lastSpace = text.lastIndexOf(" ");
    if( lastSpace > 0) {
    text = text.substr(0, lastSpace);
    }
    return text + "...";
}

function showFloatingText(text, color = '#000000', timeMs=1000, offsetY = 0) {
    let scale = 1;    
    if(window.visualViewport) {
        scale = window.visualViewport.scale;
    }    
    // Measuring text
    const measure = document.createElement('span');    
    measure.textContent = text;
    measure.style.cssText = 'visibility:hidden; position:absolute; font-size:32px; font-weight:bold; font-family:Arial,sans-serif; white-space:nowrap;';
    //measure.style.transform = `scale(${1 / scale})`;
    measure.style.transform = `scale(1)`;
    measure.style.transformOrigin = 'center';
    document.body.appendChild(measure);
    
    let width = measure.offsetWidth;
    let height = measure.offsetHeight;
    measure.remove();
    const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const vx = window.visualViewport ? window.visualViewport.offsetLeft : 0;
    const vy = window.visualViewport ? window.visualViewport.offsetTop : 0;
    let fsize = 30;
    
    if(window.visualViewport) {        
        if(scale > 1.02) {
            fsize = parseInt(fsize / scale);            
        }
        width = parseInt(width / scale); 
        height = parseInt(height / scale);
    }
    
    // Creating an element
    const floatingText = document.createElement('div');
    floatingText.textContent = text;
    floatingText.style.cssText = `
    position: fixed;
    // left: ${(window.innerWidth / 2) - (width / 2)}px;
    // top: ${(window.innerHeight / 2) - (height / 2) + offsetY}px;
    left: ${(vw / 2) - (width / 2) + vx}px;
    top: ${(vh / 2) - (height / 2) + offsetY + vy}px;
    font-size: ${fsize}px;
    font-weight: bold;
    letter-spacing: 0.07em;
    background: transparent;
    color: ${color};
    text-shadow:
        -0.4px -0.4px 0 #FFFFFF,
        1px 1px 2px black;    
    z-index: 999999;
    pointer-events: none;    
    /* white-space: nowrap; */
    font-family: Arial, sans-serif;
    transition: opacity 0.2s ease;
    opacity: 0;   
    text-align: center;
    /* transform: scale(${1 / scale}); */
    transform: scale(1);
    transformOrigin: center;
`;
    
    document.body.appendChild(floatingText);
    gamePauseSound = true;
    setTimeout(() => { floatingText.style.opacity = '1'; }, 10);
    setTimeout(() => {
        floatingText.style.opacity = '0';
        setTimeout(() => floatingText.remove(), 200);
        gamePauseSound = false;
    }, timeMs);
}

function getCharCoef(fontFamily) {
    const span = document.createElement("span");
    span.classList.add('sio-rect');
    span.classList.add('transparent');
    span.classList.add('wordshow');
    span.style.visibility = "hidden";
    span.style.fontFamily = fontFamily;
    span.style.letterSpacing = '0.07em';
    span.style.fontSize = "20px";
    span.textContent = "WWWWWW";
    document.body.appendChild(span);
    const width = span.getBoundingClientRect().width;
    document.body.removeChild(span);
    return (0.6*width) / (7.0 * 20);
}

function fitFontSizeToRect(rectElement) {
    let txt = rectElement.textContent || "";
    let word = rectElement.getAttribute('word') || "";
    let hint = rectElement.getAttribute('hint') || "";

    if (txt.length === 0 && hint.length > word.length) txt = hint;
    else if (word.length > txt.length) txt = word;

    let pz = txt.indexOf("::");
    if (pz > 0) txt = txt.slice(0, pz);

    const rect = rectElement.getBoundingClientRect();
    const rectWidth = rect.width;
    const rectHeight = rect.height;

    let len = txt.length || 1;
    
    let fontSize = 0;

    if (len <= 4) len = 4;    
    let byWidth = rectWidth / (len * charWidthCoef);
    let byHeight = rectHeight * 0.7;
    fontSize = Math.min(byWidth, byHeight);
    
    if( len > 15 && (len*fontSize) > (0.8*rectWidth) )
    {
        // 2 line
        let charsPerLine = Math.ceil(len / 2);
        let byWidth = rectWidth / (charsPerLine * charWidthCoef);
        let byHeight = (rectHeight / 2)*0.8;
        fontSize = Math.min(byWidth, byHeight);
    }
        
    let minPx = 6; // 8 in the editor  
    fontSize = Math.max(minPx, Math.min(fontSize, 100));

    rectElement.style.fontSize = fontSize + "px";
}


// Update the size of the font from the size of the image container
function updateFontSize() {    
    els = document.querySelectorAll('.sio-rect');    
    for (var i = 0; i < els.length; i++) {
        try {
            fitFontSizeToRect(els[i]);        
        } catch(err) {}        
    }
}

var scrollLeftTop = { left: -1, top: -1 };
var scrollLeftTopWfit = { left: -1, top: -1 };
var scrollLeftTopH100 = { left: -1, top: -1 };
var previous_scale = '';

function saveScrollPosition(scrollLT) {    
    const container = document.querySelector('.sio-container');
    const doc = document.scrollingElement;
    
    // --- horizontal ---
    if (container) {
        const maxScrollLeft = container.scrollWidth - container.clientWidth;        

        if (maxScrollLeft > 0) {
            scrollLT.left = container.scrollLeft / maxScrollLeft;            
        } else {
            scrollLT.left = -1;
        }
    }
    
    // --- vertical ---
    if (doc) {
        const maxScrollTop = doc.scrollHeight - doc.clientHeight;        

        if (maxScrollTop > 0) {
            scrollLT.top = doc.scrollTop / maxScrollTop;
                      
        } else {
            scrollLT.top = -1;
        }
    }
}



function restoreScrollPosition(scrollLT) {    
    const container = document.querySelector('.sio-container');
    const doc = document.scrollingElement;

    // --- horizontal ---
    if (container) {
        const maxScrollLeft = container.scrollWidth - container.clientWidth;
        
        if (maxScrollLeft > 0) {
            let ratio = scrollLT.left;            
            if (ratio === -1) ratio = 0.5;
            container.scrollLeft = maxScrollLeft * ratio;
        }
    }

    // --- vertical ---
    if (doc) {
        const maxScrollTop = doc.scrollHeight - doc.clientHeight;        

        if (maxScrollTop > 0) {
            let ratio = scrollLT.top;
            if (ratio === -1) ratio = 0;            
            doc.scrollTop = maxScrollTop * ratio;
        }
    }
}

function setCursorToEnd(element) {
    if (element.isContentEditable) {
        const range = document.createRange();
        const selection = window.getSelection();
        range.selectNodeContents(element); // Select the element contents
        range.collapse(false); // Set the cursor to the end
        selection.removeAllRanges(); // Clear the current selection
        selection.addRange(range); // Set a new range
    }
}
 
  
 
function smartScroll(el) {
    const rect = el.getBoundingClientRect();

    const fullyVisible =
        rect.top >= 0 &&
        rect.left >= 0 &&
        rect.bottom <= window.innerHeight &&
        rect.right <= window.innerWidth;

    if (fullyVisible) return;

    const partiallyVisible =
        rect.bottom > 0 &&
        rect.right > 0 &&
        rect.top < window.innerHeight &&
        rect.left < window.innerWidth;

    if (partiallyVisible) {
        // gently tighten
        el.scrollIntoView({
            behavior: 'smooth',
            block: 'nearest',
            inline: 'nearest'
        });
    } else {
        // if you can’t see it at all, the center
        el.scrollIntoView({
            behavior: 'smooth',
            block: 'center',
            inline: 'center'
        });
    }
}

 
function keydownEnterTab(e) {           
    if ((e.key === 'Enter' || e.key === 'Tab') && !(e.ctrlKey || e.metaKey) && !e.altKey ) {               
        e.preventDefault(); // Prevent default behavior
        // Find all elements with class "txt-sio-rect"
        const rectanglesALL = Array.from(document.querySelectorAll('.sio-rect'));
        const rectangles = rectanglesALL.filter(rect => !rect.classList.contains('hiding') && !rect.classList.contains('line')
            && !(rect.style.display == 'none') && rect.hasAttribute('word') && !(rect.getAttribute('word') == ''));        
        
        if (rectangles.length === 0) return; // If there are no rectangles, do nothing
        // Determine the current element with focus
        let activeElement = document.activeElement;
        if(!editMode) {
            for (var i = 0; i < rectangles.length; i++) {
                if(rectangles[i].classList.contains('selected')) {
                    activeElement = rectangles[i]; 
                    break;
                }   
            }            
        }
        const currentIndex = rectangles.indexOf(activeElement);
        if (currentIndex >= 0) {
            rectangles[currentIndex].classList.remove('selected');
            rectangles[currentIndex].contentEditable = false;
        }
        if (activeElement) activeElement.blur();
        let incN = +1;
        if(e.shiftKey) incN = -1; 
        // We go to the next element or return to the first         
        let nextIndex = (currentIndex + incN) % rectangles.length;
        if(currentIndex==0 && incN == -1) nextIndex = rectangles.length - 1;  
        const nextRectangle = rectangles[nextIndex];
        
        if(editMode) nextRectangle.contentEditable = true;
        nextRectangle.classList.add('selected');
        nextRectangle.classList.add('text-editing'); //Add a class for editing        
    
        
        
        
        nextRectangle.blur();
        // Install the focus on the next element
        nextRectangle.focus();
        if(editMode)            
                setCursorToEnd(nextRectangle);                        
        else    
            nextRectangle.click();
            
            
        // Scroll the screen to the next element
        smartScroll(nextRectangle);
        
        // Blinking frame
        nextRectangle.classList.add("flash-border");
        setTimeout(() => {
            nextRectangle.classList.remove("flash-border");
        }, 1500);
    }
}

function getUnrotatedRatios(el, e) {
    rect = el;
    const trn = rect.style.transform;
    rect.style.transform = `rotate(0deg)`;
    const rect0 = rect.getBoundingClientRect(); //Get real dimensions and position
    const rectWidth = rect0.width; //The width of the rectangle
    const rectHeight = rect0.height; //The height of the rectangle
    const rectLeft = rect0.left; //Position of a rectangle by x
    const rectTop = rect0.top; //Position of a rectangle on y
    rect.style.transform = trn;
    const x = e.clientX - rectLeft;
    const y = e.clientY - rectTop;
    // Angle of rotation
    const match = el.style.transform.match(/rotate\(([-\d.]+)deg\)/);
    const angleDeg = match ? parseFloat(match[1]) : 0;
    const angleRad = -angleDeg * Math.PI / 180;
    // Reverse the point back
    let unrotatedX = Math.cos(angleRad) * x - Math.sin(angleRad) * y;
    let unrotatedY = Math.sin(angleRad) * x + Math.cos(angleRad) * y;
    return {
        xRatio: unrotatedX / rectWidth,
        yRatio: unrotatedY / rectHeight
    };
}

function onlySimpleText(str) { // Simplifying text for comparison
    str = str.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); //Remove diacritic
    str = str.replace(/<[^>]*>/g, ""); //Delete tags
    str = str.replace(/[^\p{L}\p{N}\s]/gu, ""); //Leave only letters/numbers/gaps
    str = str.replace(/\s+/g, " "); // Multiple gaps -> one
    return str.toLowerCase().trim();
}

function onlySimpleTextNoDiacritic(str) { // Simplifying text for comparison   
    str = str.replace(/<[^>]*>/g, ""); //Delete tags
    str = str.replace(/[^\p{L}\p{N}\s]/gu, ""); //Leave only letters/numbers/gaps
    str = str.replace(/\s+/g, " "); // Multiple gaps -> one
    return str.toLowerCase().trim();
}
 
 
// text-to-speech
function speakText(txtSpeak, lng='langSS') {  
    if( langSS == '' ) return;
    if(lng == 'langSS') {        
        lng = langSS; 
    }        
        
    /* AnkiDroidJS API */
    if (typeof AnkiDroidJS !== 'undefined') {        
        async function apiADResult() {
            try { apiAnkiDroid.ankiTtsSetLanguage(lng); } catch(e){}
            try {
                if(speedSS != '') apiAnkiDroid.ankiTtsSetSpeechRate(parseFloat(speedSS)); 
                else apiAnkiDroid.ankiTtsSetSpeechRate(1.0);
            } catch(e){}
            try { apiAnkiDroid.ankiTtsStop(); } catch(e){}
            try { apiAnkiDroid.ankiTtsSpeak( txtSpeak ); } catch(e){}            
        }
        apiADResult();
    }
    else {
        try {
            let voices = speechSynthesis.getVoices();
            if (voices.length === 0) {
                speechSynthesis.onvoiceschanged = () => {
                    speakText(txtSpeak);
                };
                return;
            }
                            
            const utterance = new SpeechSynthesisUtterance(txtSpeak);
            let selectedVoice = null;                
             if (voicesSS && voicesSS.trim() !== '') {
                const preferredVoices = voicesSS
                    .split(',')
                    .map(v => v.trim().replace(/_/g, ' ').toLowerCase());
                 for (const pref of preferredVoices) {
                    selectedVoice = voices.find(v =>
                        v.name.toLowerCase().includes(pref)
                    );
                    if (selectedVoice) break;
                }
            }
            
            if (!selectedVoice) {
                selectedVoice = voices.find(v =>
                                    v.lang === lng || v.lang.startsWith(lng.slice(0, 2))
                                );
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
                utterance.lang = selectedVoice.lang;
            } else {
                utterance.lang = lng;
            }
             utterance.rate = parseFloat(speedSS) || 1.0;
                            
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                speechSynthesis.speak(utterance);                    
            }
        }
        catch(e){}
    }
}
    

function validateInput(e) {               
    let elRect = this;
    let w = elRect.getAttribute("word");
    
    const userWords = (elRect.textContent || "")
        .split("|")
        .map(s => onlySimpleText(s.trim()))
        .filter(s => s.length > 0);
        
    const userWordsND = (elRect.textContent || "")
        .split("|")
        .map(s => onlySimpleTextNoDiacritic(s.trim()))
        .filter(s => s.length > 0);
    
    const targetWords = (w || "")
        .split("|")
        .map(s => onlySimpleText(s.trim()))
        .filter(s => s.length > 0);
        
    const targetWordsND = (w || "")
        .split("|")
        .map(s => onlySimpleTextNoDiacritic(s.trim()))
        .filter(s => s.length > 0);
    
    const targetSet = new Set(targetWords);
    const userSet = new Set(userWords);
    
    const targetSetND = new Set(targetWordsND);
    const userSetND = new Set(userWordsND);
    
    if (targetSet.size === 0 || userSet.size === 0) {
        elRect.style.color = "black";
        if (elRect.classList.contains('hiding') && !elRect.classList.contains('line')) {
            elRect.style.backgroundColor = rootcss_rectblue;
        } else {
            elRect.style.backgroundColor = rootcss_rectyellow;
        }
        return;
    }
    
    const common = [...targetSet].filter(word => userSet.has(word));
    const allTargetsMatched = common.length === targetSet.size;
    
    const commonND = [...targetSetND].filter(word => userSetND.has(word));
    const allTargetsMatchedND = commonND.length === targetSetND.size;
    
    if (allTargetsMatched) {
        if (allTargetsMatchedND) {
            elRect.style.color = "black";
        }
        else {
            elRect.style.color = rootcss_diactricnotequal;
        }
        
        elRect.style.backgroundColor = rootcss_goodanswer;
        return;
    }
    

    let allUserWordsValid = true;
    for (let userWord of userSet) {
        let isValid = false;
        for (let targetWord of targetSet) {
            if (userWord === targetWord || targetWord.startsWith(userWord)) {
                isValid = true;
                break;
            }
        }
        if (!isValid) {
            allUserWordsValid = false;
            break;
        }
    }

    let allUserWordsValidND = true;
    for (let userWordND of userSetND) {
        let isValid = false;
        for (let targetWordND of targetSetND) {
            if (userWordND === targetWordND || targetWordND.startsWith(userWordND)) {
                isValid = true;
                break;
            }
        }
        if (!isValid) {
            allUserWordsValidND = false;
            break;
        }
    }
    
    if (allUserWordsValid) {
        if(allUserWordsValidND) {
            elRect.style.color = "black";
        }
        else {
            elRect.style.color = rootcss_diactricnotequal;
        }
        
        if (elRect.classList.contains('hiding') && !elRect.classList.contains('line')) {
            elRect.style.backgroundColor = rootcss_rectblue;
        } else {
            elRect.style.backgroundColor = rootcss_rectyellow;
        }
    } else {
        elRect.style.color = "black";
        elRect.style.backgroundColor = rootcss_badanswer;
        if ("vibrate" in navigator) {
            navigator.vibrate(150);
        }
    }
    
    // add |
    if (allUserWordsValid && !allTargetsMatched && userWords.length > 0) {
        let lastWord = userWords[userWords.length - 1];
        if (lastWord && targetSet.has(lastWord)) {
            let currentText = elRect.textContent;
            if (!currentText.trim().endsWith("|")) {
                elRect.textContent = currentText + " | ";
                let len = elRect.textContent.length;
                //elRect.setSelectionRange(len, len);                
                setTimeout( ()=>{
                    const range = document.createRange();
                    const selection = window.getSelection();
                    range.selectNodeContents(elRect); // Select the element contents
                    range.collapse(false); // Set the cursor to the end
                    selection.removeAllRanges(); // Clear the current selection
                    selection.addRange(range); // Set a new range
}, 0);
                /* setCursorToEnd(elRect); */
            }
        }
    }
}


function pasteSimpl(e) { // We insert only the text
    e.preventDefault(); // Prevent the standard insert behavior
    // We get a text from the Buffer of the Exchange
    const text = (e.clipboardData || window.clipboardData).getData('text');
    // document.execCommand('insertText', false, text); OLD
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
    const range = selection.getRangeAt(0);
    range.deleteContents();
    range.insertNode(document.createTextNode(text));
}



window._audioMap = new Map();

function buildAllAudios() {
    const root = document.getElementById("qa");
    if (!root) return;
    
    const soundSet = new Set();
    document.querySelectorAll('.sio-rect').forEach(div => {
        const sound = div.getAttribute('sound');
        if (sound && sound.trim() !== '') {
            soundSet.add(sound.trim());
        }
    });
  
    const existingAudios = new Map();
    root.querySelectorAll('audio[sound]').forEach(audio => {
        const soundAttr = audio.getAttribute('sound');
        if (soundAttr) {
            existingAudios.set(soundAttr, audio);
        }
    });

    // We remove from _audioMap those that are no longer in soundSet
    for (let [key, audio] of window._audioMap) {
        if (!soundSet.has(key)) {
            audio.pause();
            audio.src = '';
            if (audio.parentNode) {
                audio.parentNode.removeChild(audio);
            }
            window._audioMap.delete(key);
        }
    }

    // Now we add or update audio for each sound in the soundSet
    for (let sound of soundSet) {        
        let audio = existingAudios.get(sound);
        if (!audio) {
            audio = window._audioMap.get(sound);
            if (audio) {
                // If it is already in _audioMap, but not in root, then add it to root
                if (!audio.parentNode) {
                    root.appendChild(audio);
                }
            } else {
                // Let's create a new one
                audio = new Audio(sound);
                audio.preload = 'auto';
                audio.style.display = 'none';
                audio.setAttribute('sound', sound);  // keep the original name
                root.appendChild(audio);
            }
        } else {
            // If the audio already exists, but it is not in _audioMap, we will add it
            if (!window._audioMap.has(sound)) {           
                if (!audio.hasAttribute('sound')) {
                    audio.setAttribute('sound', sound);
                }
                // Let's also check that the audio is not in _audioMap
                window._audioMap.set(sound, audio);
            } else {
                // already exists, we do nothing
            }
        }
        
        
        const currentAudio = window._audioMap.get(sound);
        if (currentAudio !== audio) {
            // If you replaced it, we'll update it.
            window._audioMap.set(sound, audio);
        }
    }  
}


function playSound(soundName) {    
    for (let [key, audio] of window._audioMap) {
        audio.pause();
        audio.currentTime = 0;
    }
    if (soundName && soundName !== '') {
        const audio = window._audioMap.get(soundName);
        if (audio) {
            audio.pause();
            audio.currentTime = 0;
            audio.play().catch(err => console.warn('Play error:', err));
        } else {
            console.warn('Audio with sound name', soundName, 'not found');
        }
    }
}

    if (window.myAbortController2) window.myAbortController2.abort();

    static navigator_lang() {
        return navigator.language.toLowerCase().split(/[-_]/)[0];
    }

    static translate(key, lang = navigator.language) {
        const shortLang = lang.toLowerCase().split(/[-_]/)[0];        
        if (shortLang === "en") return key;
        const entry = this.#db[key];
        if (!entry) {
            console.log("ERROR translate(key, '"+lang+"'): key=" + String(key) );
            return key;
        }
        return entry[shortLang] || key;
    }
    
    static applyTranslations(root = document, lang = navigator.language) {        
        const shortLang = lang.toLowerCase().split(/[-_]/)[0];          
        // Translation <span data-trn>
        root.querySelectorAll('span').forEach(el => {            
            let istrn = el.hasAttribute('data-trn');
            let isnt = el.hasAttribute('data-trnen');
            let key = '';
            if(istrn || isnt) {
                if(isnt)
                    key = el.getAttribute('data-trnen') || ''; //en                                    
                else 
                    key = el.textContent.trim(); //en                      
                if(!isnt) el.setAttribute('data-trnen', key); //en
                el.textContent = this.translate(key, shortLang); //??
                el.removeAttribute('data-trn');                      
            }            
        });

        // Translation of title (if not already processed)
        root.querySelectorAll('[title]').forEach(el => {
            let isnt = el.hasAttribute('data-trnen');
            let key = '';
            if(isnt)
                key = el.getAttribute('data-trnen') || ''; //en                                           
            else
                key = el.getAttribute('title');   
            if(!isnt) el.setAttribute('data-trnen', key);
            el.setAttribute('title', this.translate(key, shortLang));
        });
    }
    
}

async function audioToBase64(url) {
    const response = await fetch(url);
    const blob = await response.blob();

    return new Promise(resolve => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
    });
}

async function imageToBase64(img) {
    return new Promise((resolve) => {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");    
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;    
        ctx.drawImage(img, 0, 0);    
        const dataURL = canvas.toDataURL("image/jpeg");
        resolve(dataURL);
    });
}


async function ExportToHTML() {
    const doc = document.scrollingElement || document.documentElement;
    const container = document.querySelector('.sio-container');
    const img = document.querySelector('.sio-image');
    const rect = img.getBoundingClientRect();
    
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    // X
    const imgLeft = rect.left;
    const imgX = centerX - imgLeft;
    const x = imgX / rect.width;

    // Y 
    const maxScrollY = doc.scrollHeight - window.innerHeight;

    let y = -1;
    if (maxScrollY > 0) {
        y = doc.scrollTop / maxScrollY;
    }

    const root = document.getElementById("qa").cloneNode(true);
    const imgContainer = root.querySelector('.sio-image-container');
    imgContainer.dataset.centerX = x;
    imgContainer.dataset.centerY = y;
    if (imgContainer.classList.contains('wfit') || imgContainer.classList.contains('h100')) {       
        delete imgContainer.dataset.centerX;
        delete imgContainer.dataset.centerY;
    } else {        
        imgContainer.dataset.centerX = x;
        imgContainer.dataset.centerY = y;
    }
     
    const images = root.querySelectorAll("img");    
    for (let img of images) {
        try {
            // Important: take the original from the DOM (not clone)
            const originalImg = document.querySelector(`img[src="${img.getAttribute("src")}"]`);
            const base64 = await imageToBase64(originalImg);

            img.setAttribute("src", base64);
        } catch (e) {
            console.warn("Error with the image:", e);
        }
    }
    
    // Replacing the sound buttons in a computer application
    if (isDesk) {
        const links = root.querySelectorAll('a.replay-button.soundLink');    
        links.forEach(link => {
            const src = link.getAttribute('data-srcsio'); // 'data-srcsio' creates an addon 'Simple Image Occlusion'            
            const audio = document.createElement('audio');
            audio.setAttribute('controls', '');    
            const source = document.createElement('source');
            source.setAttribute('src', src);
            source.setAttribute('type', 'audio/mpeg');    
            audio.appendChild(source);                
            link.replaceWith(audio);
        });
    }
    
    const sources = root.querySelectorAll("audio source");        
    for (let srcEl of sources) {
        try {
            const src = srcEl.getAttribute("src");
            if (!src) continue;        
            const base64 = await audioToBase64(src);        
            srcEl.setAttribute("src", base64);
    
        } catch (e) {
            console.warn("Error with audio:", e);
        }
    }
    const audios = root.querySelectorAll("audio");        
    for (let audio of audios) {
        const src = audio.getAttribute("src");
        const sound = audio.getAttribute("sound");
        if (!src) continue;        
        try {
            const base64 = await audioToBase64(src);
            audio.setAttribute("src", base64);
            if(sound) audio.setAttribute("sound", sound);
        } catch (e) {
            console.warn("Error with audio src:", e);
        }
    }
    
    
        
    let fileNameIOS = "IOS_" + new Date().toISOString().replace('T', ' ').split('.')[0] + ".html"; 
    const elf_header = root.querySelector("#f_header"); 
    if(elf_header) {
        let text = elf_header.innerText
        fileNameIOS = text.replace(/[\<\>\:\"\/\\\|\?\*]/g, '').replace(/[\x00-\x1f]/g, '');

function throttle(fn, delay) {
    let last = 0;
    return function (...args) {
        const now = Date.now();
        if (now - last >= delay) {
            last = now;
            fn.apply(this, args);
        }
    };
}



function getLinePoints(el) {
    const style = getComputedStyle(el);
    const container = document.querySelector('.sio-image-container');
    const rect = container.getBoundingClientRect();

    let left = parseFloat(el.style.left);
    let top = parseFloat(el.style.top);
    let width = parseFloat(el.style.width);

    if (el.style.left.includes('%')) {
        left = rect.width * (left / 100);
    }
    if (el.style.top.includes('%')) {
        top = rect.height * (top / 100);
    }
    if (el.style.width.includes('%')) {
        width = rect.width * (width / 100);
    }

        
    
    let angle = 0;    
    let transform = style.transform;
    
    if (!transform || transform === 'none') {
        transform = el.style.transform;
    }
    
    if (transform && transform !== 'none') {
        const rotateMatch = transform.match(/rotate\(([-\d.]+)deg\)/);
        if (rotateMatch) {
            angle = parseFloat(rotateMatch[1]) * Math.PI / 180;
        }         
        else {
            const match = transform.match(/matrix\(([^)]+)\)/);
            if (match) {
                const values = match[1].split(',').map(Number);
                angle = Math.atan2(values[1], values[0]);
            }
        }
    }
    
    
    const x1 = left;
    const y1 = top;
    const x2 = x1 + width * Math.cos(angle);
    const y2 = y1 + width * Math.sin(angle);

    return { x1, y1, x2, y2, angle };
}



function pointInRotatedRect(px, py, el) {
    const style = getComputedStyle(el);
    const container = document.querySelector('.sio-image-container');
    const rect = container.getBoundingClientRect();

    // coordinates inside the container
    let left = parseFloat(el.style.left);
    let top = parseFloat(el.style.top);
    let width = parseFloat(el.style.width);
    let height = parseFloat(el.style.height);

    if (el.style.left.includes('%')) {
        left = rect.width * (left / 100);       
    }
    if (el.style.top.includes('%')) { 
        top = rect.height * (top / 100);
    }
    if (el.style.width.includes('%')) {
        width = rect.width * (width / 100);
    }
    if (el.style.height.includes('%')) {
        height = rect.height * (height / 100);
    }


    let angle = 0;    
    let transform = style.transform;
    
    if (!transform || transform === 'none') {
        transform = el.style.transform;
    }
    
    if (transform && transform !== 'none') {
        const rotateMatch = transform.match(/rotate\(([-\d.]+)deg\)/);
        if (rotateMatch) {
            angle = parseFloat(rotateMatch[1]) * Math.PI / 180;
        }         
        else {
            const match = transform.match(/matrix\(([^)]+)\)/);
            if (match) {
                const values = match[1].split(',').map(Number);
                angle = Math.atan2(values[1], values[0]);
            }
        }
    }

    // transferring a rectangle to the system (top-left)
    const dx = px - left;
    const dy = py - top;

    // reverse rotation around (0,0)
    const cos = Math.cos(-angle);
    const sin = Math.sin(-angle);

    const rx = dx * cos - dy * sin;
    const ry = dx * sin + dy * cos;

    return (
        rx >= 0 &&
        ry >= 0 &&
        rx <= width &&
        ry <= height
    );
}



function handleMove(e) {
    const lines = document.querySelectorAll('.sio-rect.line');
    //const rects = document.querySelectorAll('.sio-rect:not(.line):not(.hiding)');
    const rects = document.querySelectorAll('.sio-rect:not(.line)');
    const container = document.querySelector('.sio-image-container');
    const rect = container.getBoundingClientRect();
    
    let closestLine = null;
    let minDist = Infinity;
    
    const xCnt = e.clientX - rect.left;
    const yCnt = e.clientY - rect.top;
    
    // looking for the nearest line
    lines.forEach(line => {
        const { x1, y1 } = getLinePoints(line);

        const dx = xCnt - x1;
        const dy = yCnt - y1;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist <= (movewh/2) && dist < minDist) { // movewh = 30
            minDist = dist;
            closestLine = line;
        }
    });

    // if there is no line
    if (!closestLine) {
        imageSIOR.style.cursor = 'default';
        moveLineEl = null;
        moveRectEl = null;

        if (moveBacklight) {
            document.querySelectorAll('.move-backlight')
                .forEach(el => el.classList.remove('move-backlight'));
            moveBacklight = false;
        }

        return;
    }

    imageSIOR.style.cursor = 'pointer';
    moveLineEl = closestLine;

    // looking for the end of the line (where the point is)
    const { x2, y2 } = getLinePoints(closestLine);

    let foundRect = null;

    rects.forEach(rect => {
        if (pointInRotatedRect(x2, y2, rect)) {
            foundRect = rect;
        }
    });

    // if you find a rectangle
    if (foundRect) {
        moveRectEl = foundRect;

        document.querySelectorAll('.move-backlight')
            .forEach(el => el.classList.remove('move-backlight'));

        if( !(gameRun && gameI >= 0 && closestLine.classList.contains('notvisible') ) ) {
            foundRect.classList.add('move-backlight');
            closestLine.classList.add('move-backlight');
        }            

        moveBacklight = true;
    } else {
        moveRectEl = null;

        if (moveBacklight) {
            document.querySelectorAll('.move-backlight')
                .forEach(el => el.classList.remove('move-backlight'));
            moveBacklight = false;
        }
    }
}

function updateControlsPosition() {    
    const controls = document.getElementById('sio-controls');
    if (!controls || !window.visualViewport) return;

    const vv = window.visualViewport;

    const scale = vv.scale;
    
    if(scale > 0.98 && scale < 1.02) {
        if( !controls.classList.contains('scale1') )
            controls.classList.add('scale1');
        return;
    }
    else {
        controls.classList.remove('scale1');        
    }

    // compensate for the zoom
    controls.style.transform = `
        translateX(-50%)
        scale(${1 / scale})
    `;
    const rectCn = controls.getBoundingClientRect();
    const bottomOffset = 30 + rectCn.height;

    const visualBottom = vv.height + vv.offsetTop;

    controls.style.top = `${visualBottom - bottomOffset}px`;
    controls.style.left = `${vv.offsetLeft + vv.width / 2}px`;
}



function cursorBtn() {
    bigCursorEnabled = !bigCursorEnabled;
    const cursorButton = document.getElementById('cursorButton');
    if (bigCursorEnabled) {
        bigCursor.style.display = 'block';
        cursorButton.classList.add('pressed');
        document.body.classList.add('pointer-enabled');
    } else {
        bigCursor.style.display = 'none';
        cursorButton.classList.remove('pressed');
        document.body.classList.remove('pointer-enabled');
    }
}





function getPercentCoords(e, canvas) {
    const rect = canvas.getBoundingClientRect();

    const x = (e.clientX - rect.left) / rect.width * 100;
    const y = (e.clientY - rect.top) / rect.height * 100;

    return { x, y };
}



function redraw() {
    ctx.clearRect(0, 0, canvasDL.width, canvasDL.height);

    strokes.forEach(stroke => {        
        if (stroke.type === 'draw') {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 4;            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();

            stroke.points.forEach((p, i) => {
                const x = p.x / 100 * canvasDL.width;
                const y = p.y / 100 * canvasDL.height;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });

            ctx.stroke();
        }

        if (stroke.type === 'erase') {
            ctx.globalCompositeOperation = 'destination-out';

            stroke.points.forEach(p => {
                const x = p.x / 100 * canvasDL.width;
                const y = p.y / 100 * canvasDL.height;

                ctx.beginPath();
                ctx.arc(x, y, 10, 0, Math.PI * 2); // 20px diameter
                ctx.fill();
            });
        } 
    }); 
    
    
}


function resizeCanvas() {
    const rect = img.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvasDL.width = rect.width * dpr;
    canvasDL.height = rect.height * dpr;
    canvasDL.style.width = rect.width + 'px';
    canvasDL.style.height = rect.height + 'px';    
    redraw();
}


function clearAllCanvas() {
    strokes = [];
    redraw();
}


function undoCanvas() {
    strokes.pop();
    redraw();
}

// Copy to clipboard for older browsers
function fallbackCopyToClipboard(text) {
    const div = document.createElement("div");
    div.textContent = text;
    div.style.position = "fixed";
    div.style.left = "-999999px";
    div.style.top = "0";
    div.style.whiteSpace = "pre";
    div.style.userSelect = "text";

    document.body.appendChild(div);

    try {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(div);
        selection.removeAllRanges();
        selection.addRange(range);
        const ok = document.execCommand('copy');
        selection.removeAllRanges();
        return ok;

    } catch (err) {
        console.error('Clipboard write error:', err);
        return false;
    } finally {
        document.body.removeChild(div);
    }
}


// The main function of copying to the clipboard
async function copyToClipboard(text) {    
    if (typeof pycmd !== "undefined") {        
        try {
            // An alternative method for older browsers           
            fallbackCopyToClipboard(text);            
        } catch(e) {
            await navigator.clipboard.writeText(text);            
        }   
    }
    else {
        try {
            await navigator.clipboard.writeText(text);
        } catch(e) {
            // An alternative method for older browsers           
            fallbackCopyToClipboard(text);
        }        
    }        
}
